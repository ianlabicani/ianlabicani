<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="280" viewBox="0 0 1200 280" role="img" aria-labelledby="title description">
  <title id="title">Ian Labicani — full-stack developer</title>
  <desc id="description">A subtle indigo developer profile banner for Ian Labicani.</desc>

  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b1020" />
      <stop offset="55%" stop-color="#172554" />
      <stop offset="100%" stop-color="#312e81" />
    </linearGradient>

    <radialGradient id="blueGlow" cx="0.82" cy="0.18" r="0.75">
      <stop offset="0%" stop-color="#60a5fa" stop-opacity="0.34" />
      <stop offset="100%" stop-color="#60a5fa" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="violetGlow" cx="0.08" cy="0.9" r="0.7">
      <stop offset="0%" stop-color="#a78bfa" stop-opacity="0.18" />
      <stop offset="100%" stop-color="#a78bfa" stop-opacity="0" />
    </radialGradient>

    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#bfdbfe" stroke-opacity="0.08" stroke-width="1" />
    </pattern>

    <filter id="softBlur" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="24" />
    </filter>
  </defs>

  <rect width="1200" height="280" rx="28" fill="url(#background)" />
  <rect width="1200" height="280" rx="28" fill="url(#grid)" />
  <rect width="1200" height="280" rx="28" fill="url(#blueGlow)" />
  <rect width="1200" height="280" rx="28" fill="url(#violetGlow)" />

  <circle cx="1015" cy="62" r="92" fill="#93c5fd" fill-opacity="0.08" filter="url(#softBlur)" />
  <circle cx="1060" cy="215" r="74" fill="#c4b5fd" fill-opacity="0.09" filter="url(#softBlur)" />

  <path d="M 790 0 C 900 54, 930 132, 1200 164" fill="none" stroke="#93c5fd" stroke-opacity="0.18" stroke-width="2" />
  <path d="M 840 0 C 950 64, 980 142, 1200 190" fill="none" stroke="#c4b5fd" stroke-opacity="0.12" stroke-width="2" />

  <g fill="#bfdbfe" fill-opacity="0.6">
    <circle cx="942" cy="72" r="3" />
    <circle cx="1010" cy="126" r="2" />
    <circle cx="1092" cy="92" r="2" />
    <circle cx="1128" cy="184" r="3" />
    <circle cx="930" cy="218" r="2" />
  </g>

  <text x="76" y="120" fill="#f8fafc" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif" font-size="48" font-weight="700" letter-spacing="4">IAN LABICANI</text>
  <text x="80" y="164" fill="#bfdbfe" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif" font-size="18" font-weight="600" letter-spacing="4">FULL-STACK DEVELOPER</text>
  <rect x="80" y="194" width="132" height="4" rx="2" fill="#60a5fa" />
  <text x="80" y="232" fill="#cbd5e1" fill-opacity="0.86" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif" font-size="14" letter-spacing="1.2">WEB · MOBILE · BUSINESS SYSTEMS</text>
</svg>
